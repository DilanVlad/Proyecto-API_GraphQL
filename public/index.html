<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Alquileres</title>
    <!-- Bootstrap 5 CSS (Light Mode default) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Login Container Wrapper -->
    <div id="login-container" class="d-flex align-items-center justify-content-center min-vh-100 d-none">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4" id="login-view-wrapper">
                            <!-- Formulario de login cargado por JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Container (Dashboard) -->
    <div id="app-container" class="container-fluid d-none p-0">
        <div class="row g-0">
            <!-- Sidebar Navigation (Dark) -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark text-white min-vh-100 p-0">
                <div class="p-3 border-bottom border-secondary bg-dark text-white">
                    <h5 class="m-0 font-weight-bold">Alquileres App</h5>
                </div>
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column" id="menu-items">
                        <!-- Items de menú cargados dinámicamente -->
                    </ul>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 p-0">
                <!-- Top Header (Stuck to top) -->
                <header class="d-flex justify-content-between align-items-center p-3 border-bottom bg-white w-100 sticky-top">
                    <h1 class="h4 text-secondary m-0 font-weight-bold" id="view-title">Dashboard</h1>
                    <div class="d-flex align-items-center">
                        <span class="me-3 text-muted" id="user-display">Usuario: ...</span>
                        <button class="btn btn-outline-danger btn-sm" id="btn-logout">Cerrar Sesión</button>
                    </div>
                </header>

                <!-- Dynamic View Wrapper with padding -->
                <div class="p-4">
                    <div class="card shadow-sm border-0 bg-white p-4">
                        <div id="app-content">
                            <!-- Contenido dinámico cargado por JS -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Contenedores para Plantillas de Impresión PDF -->
    <div id="general-print-template"></div>
    <div id="individual-print-template"></div>

    <!-- Main Module Script -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
